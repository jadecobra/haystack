[project]
name = "LongMuch-backend"
version = "0.1.0"
description = "LongMuch FastAPI backend: SEC EDGAR + FRED metrics API and CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.16.3",
    "fastapi>=0.131.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.41.0",
]

[project.scripts]
longmuch = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]
