# Nightly S&P 1500 & S&P 500 OE-yield snapshots after US close.
# Writes ranked JSON into the repo (Vercel static fail-soft + Render seed).
# No Redis. Does not hit live analyze for the UI.

name: S&P 500 OE-yield screen

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-sp500
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SCREEN_APP_ID }}
          private-key: ${{ secrets.SCREEN_APP_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: uv sync
      - name: Screen cache date
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore EDGAR and quote cache
        id: screen-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            backend/.cache/companyfacts
            backend/.cache/quotes
          key: screen-cache-${{ steps.today.outputs.date }}
      - name: Refresh per-class share counts (multi-class issuers, #53)
        working-directory: backend
        # Fail-soft: a SEC hiccup keeps the committed seed.
        run: uv run longmuch share-classes-refresh || echo "share-classes-refresh failed; keeping seed"
      - name: Build screen snapshot
        working-directory: backend
        run: |
          mkdir -p .cache/companyfacts .cache/quotes
          uv run longmuch screen-build --universe sp1500 --seed --workers 4
      - name: Save EDGAR and quote cache
        if: always() && steps.screen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            backend/.cache/companyfacts
            backend/.cache/quotes
          key: screen-cache-${{ steps.today.outputs.date }}
      - name: Commit snapshot if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/screen/sp1500-oe-yield.json backend/data/sp1500-oe-yield.json frontend/public/screen/sp500-oe-yield.json backend/data/sp500-oe-yield.json backend/data/share_class_counts.json
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(screen): refresh S&P 1500 and S&P 500 OE-yield snapshots"
          git pull --rebase origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # main requires backend + frontend on the pushed sha before accepting a
      # push. Check out with the app token so pushing to main fires CI and
      # Deploy website automatically (do not dispatch deploy.yml twice). Keep
      # GH_TOKEN as github.token for gh workflow/run calls because the app lacks
      # actions: write.
      - name: Push snapshot through CI
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=bot/screen-snapshot
          for attempt in 1 2 3; do
            sha=$(git rev-parse HEAD)
            git push --force origin "HEAD:refs/heads/$branch"
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci.yml --ref "$branch"
            run_id=""
            for i in $(seq 1 30); do
              sleep 10
              run_id=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch \
                --json databaseId,headSha,createdAt \
                -q "map(select(.headSha==\"$sha\" and .createdAt>=\"$since\"))|sort_by(.createdAt)|last|.databaseId // empty")
              [ -n "$run_id" ] && break
            done
            [ -n "$run_id" ] || { echo "dispatched CI run for $sha not found"; exit 1; }
            echo "watching CI run $run_id for $sha"
            gh run watch "$run_id" --exit-status
            if git push origin "HEAD:main"; then
              git push origin --delete "$branch" || true
              echo "landed $sha on main; Deploy website triggered by app-token push"
              exit 0
            fi
            git pull --rebase origin main
            if [ "$(git rev-parse HEAD)" = "$sha" ]; then
              echo "push rejected but main did not move; not retrying the same sha"
              exit 1
            fi
            echo "main moved; re-checking rebased commit"
          done
          exit 1
