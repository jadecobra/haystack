# Nightly S&P 500 OE-yield snapshot after US close.
# Writes ranked JSON into the repo (Vercel static fail-soft + Render seed).
# No Redis. Does not hit live analyze for the UI.

name: S&P 500 OE-yield screen

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: screen-sp500
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: uv sync
      - name: Build screen snapshot
        working-directory: backend
        env:
          HAYSTACK_SEC_USER_AGENT: ${{ secrets.HAYSTACK_SEC_USER_AGENT }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        run: uv run longmuch screen-build --seed
      - name: Commit snapshot if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/screen/sp500-oe-yield.json backend/data/sp500-oe-yield.json
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
            exit 0
          fi
          git commit -m "chore(screen): refresh S&P 500 OE-yield snapshot"
          git pull --rebase origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # main requires backend + frontend on the pushed sha, and GITHUB_TOKEN
      # pushes fire no push/pull_request workflows. So: push the commit to a
      # bot branch, dispatch CI on it, wait for exactly that dispatched run
      # (CI posts backend/frontend commit statuses on dispatch, which
      # protection accepts; dispatch job checks alone do not count), then
      # fast-forward main to that sha. GITHUB_TOKEN pushes also don't fire
      # Deploy website, so dispatch it explicitly once main has moved.
      - name: Push snapshot through CI
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=bot/screen-snapshot
          for attempt in 1 2 3; do
            sha=$(git rev-parse HEAD)
            git push --force origin "HEAD:refs/heads/$branch"
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci.yml --ref "$branch"
            run_id=""
            for i in $(seq 1 30); do
              sleep 10
              run_id=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch \
                --json databaseId,headSha,createdAt \
                -q "map(select(.headSha==\"$sha\" and .createdAt>=\"$since\"))|sort_by(.createdAt)|last|.databaseId // empty")
              [ -n "$run_id" ] && break
            done
            [ -n "$run_id" ] || { echo "dispatched CI run for $sha not found"; exit 1; }
            echo "watching CI run $run_id for $sha"
            gh run watch "$run_id" --exit-status
            if git push origin "HEAD:main"; then
              git push origin --delete "$branch" || true
              gh workflow run deploy.yml --ref main
              echo "landed $sha on main; dispatched Deploy website"
              exit 0
            fi
            git pull --rebase origin main
            if [ "$(git rev-parse HEAD)" = "$sha" ]; then
              echo "push rejected but main did not move; not retrying the same sha"
              exit 1
            fi
            echo "main moved; re-checking rebased commit"
          done
          exit 1
