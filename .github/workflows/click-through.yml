# Preview click-through. The check name is `click-through / preview`.
# The job builds the app in the runner and drives that local server.
# GitHub-hosted runners only. Do not add this check to branch protection (#110).

name: click-through

on:
  pull_request:
  push:
    branches: [issue-119-redproof]

permissions:
  contents: read

concurrency:
  group: click-through-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Click through the local build
        env:
          CLICK_FRONTEND_PORT: "3466"
          CLICK_BACKEND_PORT: "8021"
        run: bash scripts/click-through/click-through-gate.sh
