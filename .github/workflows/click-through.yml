# Preview click-through. The check name is `click-through / preview`.
# The job builds the app in the runner and drives that local server.
# GitHub-hosted runners only. Do not add this check to branch protection (#110).

name: click-through

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: click-through-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright
        working-directory: scripts/click-through
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run click-through fault suite
        run: node scripts/click-through/click-through-faults.cjs
      - name: Click through the local build
        env:
          CLICK_FRONTEND_PORT: "3466"
          CLICK_BACKEND_PORT: "8021"
          CLICK_SKIP_PLAYWRIGHT_INSTALL: "1"
        run: bash scripts/click-through/click-through-gate.sh
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: click-through-preview-screenshots
          path: scripts/click-through/artifacts
          if-no-files-found: ignore
