# Dependabot: weekly version updates + grouped security updates.
# - minor/patch version updates: one grouped PR per ecosystem (auto-merged by
#   .github/workflows/dependabot-auto-merge.yml once CI is green)
# - security updates: one grouped PR per ecosystem
# - semver-major updates: npm and uv stay ungrouped (separate PRs, merged by hand).
#   github-actions majors sit in actions-all. A grouped PR that includes a
#   semver-major stays manual (dependabot-auto-merge.yml is patch and minor only).
# uv: the live lock is the ROOT uv.lock (uv workspace; backend/ is a member and
# has no lockfile of its own since 5c36d47), so the uv directory is "/".
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      actions-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major, minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
