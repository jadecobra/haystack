port: 3000

defaults:
  runtime: tmux
  agent: aider
  workspace: worktree
  notifiers: [desktop]

projects:
  longmuch:
    repo: jadecobra/haystack
    path: .
    defaultBranch: main
    sessionPrefix: lm
    agentConfig:
      model: openrouter/arcee-ai/trinity-large-preview:free

reactions:
  ci-failed:
    auto: true
    action: send-to-agent
    retries: 3
  changes-requested:
    auto: true
    action: send-to-agent
    escalateAfter: 25m
  approved-and-green:
    auto: false
    action: notify
